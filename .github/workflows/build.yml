name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder
          NEXTAUTH_URL: http://localhost:3000
          AUTH_GOOGLE_ID: ci-build-placeholder
          AUTH_GOOGLE_SECRET: ci-build-placeholder
          COLLEGE_EMAIL_DOMAIN: spjimr.org
          DATA_FILE: .data/competition.json
          DEMO_MODE: "true"
          REQUIRE_SIGN_IN: "false"
